# Push to main → build + unit tests in arm64 images on GitHub's runner → push to GHCR →
# deploy on the Raspberry Pi (self-hosted runner, label `funtrade`). Pull requests build and
# test only. The Pi's runner only connects out to GitHub; no port is opened at home.
# Two images: the bot (repo root Dockerfile) and the dashboard (dashboard/Dockerfile). A push
# that only touches dashboard/ (or docs) skips the bot build and deploys the dashboard alone,
# right away: it never restarts the bot.
name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy now, even around the close or when the bot can't hand over (may cancel today's MOC orders)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/eladsez/funtrade
  DASH_IMAGE: ghcr.io/eladsez/funtrade-dashboard

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      bot: ${{ steps.diff.outputs.bot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: no secrets or runtime state in the repo
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|^state/|^logs/|^deploy/gateway/' || true)
          if [ -n "$bad" ]; then echo "::error::tracked files that must never be committed:"; echo "$bad"; exit 1; fi

      # The bot is rebuilt (and redeployed, outside market hours) unless every changed file
      # is under dashboard/ or docs/, or a top-level Markdown file. Manual runs: always.
      - id: diff
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          bot=true
          if [ "${{ github.event_name }}" != workflow_dispatch ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            other=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -vE '^(dashboard/|docs/)|^[^/]+\.md$' || true)
            [ -z "$other" ] && bot=false
          fi
          echo "bot=$bot" >> "$GITHUB_OUTPUT"
          echo "bot changed: $bot"

  build:
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-24.04-arm   # native arm64, same as the Pi
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build (runs the unit tests) and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-dashboard:
    needs: changes
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build (lint, typecheck, backend tests) and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard/Dockerfile
          platforms: linux/arm64
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DASH_IMAGE }}:${{ github.sha }}
            ${{ env.DASH_IMAGE }}:latest
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  deploy:
    needs: [changes, build, build-dashboard]
    # build is skipped when only the dashboard changed
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.build-dashboard.result == 'success' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.changes.outputs.bot == 'false'))
    runs-on: [self-hosted, funtrade]
    environment: rpi-paper
    timeout-minutes: 600   # deploy.sh may wait out the US session (up to ~7.5h)
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            scripts/state_report.py
          sparse-checkout-cone-mode: false

      - name: log in to GHCR (job token, expires with the job)
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: deploy
        run: deploy/deploy.sh "${{ github.sha }}"
        env:
          FORCE_DEPLOY: ${{ inputs.force && '1' || '' }}
          DASHBOARD_ONLY: ${{ needs.changes.outputs.bot == 'false' && '1' || '' }}

      - name: log out of GHCR
        if: always()
        run: docker logout ghcr.io
